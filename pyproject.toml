[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayman-elsherbeny-automation"
version = "1.0.0"
description = "أوتوميشن أيمن الشربيني - تحويل نص/صور إلى فيديو مع صوت"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "أيمن الشربيني", email = ""}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "diffusers>=0.25.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.4.9",
    "edge-tts>=6.1.0",
    "ffmpeg-python>=0.2.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
coqui = ["TTS>=0.16.0"]
gtts = ["gtts>=2.4.0"]
pyttsx3 = ["pyttsx3>=2.90"]
xformers = ["xformers>=0.0.22"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
all = [
    "TTS>=0.16.0",
    "gtts>=2.4.0",
    "pyttsx3>=2.90",
    "xformers>=0.0.22",
]

[project.scripts]
ayman-elsherbeny = "ayman_elsherbeny_automation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ayman_elsherbeny_automation*"]

[tool.setuptools.package-data]
"ayman_elsherbeny_automation" = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false